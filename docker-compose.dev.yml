version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: pickandgo-db
    environment:
      POSTGRES_DB: pickandgo_dev
      POSTGRES_USER: pickandgo_admin
      POSTGRES_PASSWORD: dev_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pickandgo_admin"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
