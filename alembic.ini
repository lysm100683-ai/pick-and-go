[alembic]
# Location of migration scripts directory
script_location = alembic

# Add project root to Python path so db/models.py can be imported
prepend_sys_path = .

# OS-specific path separator for version files
version_path_separator = os

# DB URL is set dynamically in alembic/env.py from .env file
sqlalchemy.url =

# Timestamp format for migration filenames (e.g. 20260402_1200_slug)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
